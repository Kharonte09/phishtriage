name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerar el correo de ejemplo
        run: python3 samples/make_sample.py
      - name: Motor JS + paridad con el CLI
        run: node tests/run-tests.mjs
      - name: Interfaz web (jsdom)
        run: |
          npm install --no-save jsdom
          node tests/ui-test.mjs
      - name: Comprobar que el CLI marca el ejemplo como critico
        run: |
          python3 cli/phishtriage.py samples/sample-phishing.eml --quiet --no-color || code=$?
          test "${code:-0}" = "3"
      - name: Ninguna clave de API en el repositorio
        run: |
          ! git grep -nIE '(VT_API_KEY|ABUSEIPDB_API_KEY)\s*[:=]\s*["'"'"']?[A-Za-z0-9]{20,}' -- . \
            || (echo "posible clave hardcodeada" && exit 1)
          ! test -f assets/config.local.js
