name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Motor de analisis
        run: node tests/run-tests.mjs

      - name: Interfaz web
        run: |
          npm install --no-save jsdom
          node tests/ui-test.mjs
